name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag and project version
        run: |
          PROJECT_VERSION=$(scripts/read-version.sh)
          if [[ "$GITHUB_REF_NAME" != "v$PROJECT_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version v$PROJECT_VERSION"
            exit 1
          fi

      - name: Test
        run: |
          xcodebuild test \
            -project CoffeeBar/CoffeeBar.xcodeproj \
            -scheme CoffeeBar \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/CoffeeBarTests" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package universal app
        run: scripts/package-release.sh "$GITHUB_REF_NAME"

      - name: Locate release assets
        id: assets
        run: |
          VERSION=$(scripts/read-version.sh)
          ZIP="build/release/CoffeeBar-macos-universal-$VERSION.zip"
          SHA_FILE="$ZIP.sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha_file=$SHA_FILE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              '${{ steps.assets.outputs.zip }}' \
              '${{ steps.assets.outputs.sha_file }}' \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              '${{ steps.assets.outputs.zip }}' \
              '${{ steps.assets.outputs.sha_file }}' \
              --verify-tag \
              --generate-notes \
              --title "CoffeeBar ${{ steps.assets.outputs.version }}"
          fi
