name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: |
          xcodebuild test \
            -project CoffeeBar/CoffeeBar.xcodeproj \
            -scheme CoffeeBar \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/CoffeeBarDerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release
        run: |
          xcodebuild build \
            -project CoffeeBar/CoffeeBar.xcodeproj \
            -scheme CoffeeBar \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/CoffeeBarRelease" \
            CODE_SIGNING_ALLOWED=NO
